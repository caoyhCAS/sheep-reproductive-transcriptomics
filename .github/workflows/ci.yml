name: Reconstruction checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/demo.py --output results/demo
      - run: python scripts/workflow.py --config config/paper.json --samples config/samples.tsv --stage all --output results/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-and-plan
          path: results/
